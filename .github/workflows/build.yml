name: QWRT AX6600
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Clone QWRT
        run: |
          git clone https://github.com/QWRT/QWRT.git
          cd QWRT
          sed -i '/qcn9024/,/}/c\                status = "disabled";' target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/jdcloud_athenea_ax6600.dts

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev git wget unzip

      - name: Update feeds
        run: |
          cd QWRT
          cat >> feeds.conf.default <<'EOF'
src-git istore https://github.com/istoreos/istoreos-packages
src-git small https://github.com/kenzok8/small
src-git openclash https://github.com/vernesong/OpenClash
EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config
        run: |
          cd QWRT
          cat > .config <<'EOF'
CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y
CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_athenea_ax6600=y
CONFIG_TARGET_ROOTFS_PARTSIZE=1024
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_luci-app-athenea_screen=y
CONFIG_PACKAGE_luci-app-store=y
CONFIG_PACKAGE_luci-app-smp=y
CONFIG_PACKAGE_luci-app-usteer=y
CONFIG_PACKAGE_luci-app-mosdns=y
CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_luci-app-firewall=y
CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_openssh-sftp-server=y
CONFIG_PACKAGE_blockd=y
CONFIG_PACKAGE_kmod-fs-ext4=y
CONFIG_PACKAGE_kmod-fs-f2fs=y
CONFIG_PACKAGE_luci-app-diskman=y
EOF
          make defconfig

      - name: Download
        run: cd QWRT && make download -j8

      - name: Build
        run: cd QWRT && make -j$(nproc) V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: QWRT/bin/targets/qualcommax/ipq60xx/*.bin
          retention-days: 7
